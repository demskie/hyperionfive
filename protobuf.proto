// protobuf.proto


syntax = "proto3";
package main;


message SolarObject {
	string name = 1;
	int64 localX = 2;
	int64 localY = 3;
	string owner = 16;
	int32 food = 17;
	uint64 population = 18;
	int32 type = 19;
	int32 health = 20;
}


message SolarSystem {
    string name = 1;
    int64 interX = 2;
    int64 interY = 3;
    int32 type = 16;
	repeated SolarObject solarobjectslice = 128;
}


message Galaxy {
    string name = 1;
    int64 globalX = 2;
    int64 globalY = 3;
    int32 type = 16;
	repeated SolarSystem solarsystemslice = 128;
}

