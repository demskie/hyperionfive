// protobuf.proto


syntax = "proto3";
package main;


message Planet {
    string name = 1;
    int64 localX = 2;
    int64 localY = 3;
    string owner = 4;
    uint64 population = 5;
    int32 type = 6;
    int32 food = 7;
	int32 health = 8;
}


message Spaceship {
    string name = 1;
    int64 localX = 2;
    int64 localY = 3;
    string owner = 4;
    uint64 population = 5;
    int32 weapons = 6;
    int32 engines = 7;
    int32 shields = 8;
	int32 special = 9;
    int32 type = 10;
    int32 health = 11;
}


message OtherObject {
	string name = 1;
	int64 localX = 2;
	int64 localY = 3;
	string owner = 4;
	int32 economicValue = 5;
	int32 type = 6;
	int32 health = 7;
}


message SolarSystem {
    string name = 1;
    int64 interX = 2;
    int64 interY = 3;
    repeated Planet planetslice = 4;
    repeated Spaceship spaceshipslice = 5;
	repeated OtherObject otherobjectslice = 6;
    int32 type = 7;
}


message Galaxy {
    string name = 1;
    int64 globalX = 2;
    int64 globalY = 3;
    repeated SolarSystem solarsystemslice = 4;
    int32 type = 5;
}


