syntax = "proto3";
package frontendmessage;

// frontend server >>> client

message Backend {
	string hostname = 1;
	int64 globalX = 2;
	int64 globalY = 3;
	map<string, int32> playerStrength = 4;
}

message ServerInfo {
	string errorMessage = 1;
	string instanceName = 2;
	int32 version = 3;
	int32 precision = 4;
	map<int32, Backend> servers = 5;
}
