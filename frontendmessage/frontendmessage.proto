syntax = "proto3";
package frontendmessage;

// frontend server >>> client

message Backend {
	string hostname = 1;
	int64 globalX = 2;
	int64 globalY = 3;
	int32 numberOfPlayers = 4;
	map<int32, int32> factionStrength = 5;
}

message ServerInfo {
	string errorMessage = 1;
	string instanceName = 2;
	int32 version = 3;
	map<uint64, Backend> yourServers = 4;
	map<uint64, Backend> allServers = 5;
}
