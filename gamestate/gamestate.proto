protoc -I=. -I=$GOPATH/src -I=$GOPATH/src/github.com/gogo/protobuf/protobuf --gogoslick_out=$GOPATH/src/github.com/demskie/hyperionfive/gamestate --proto_path=$GOPATH/src/github.com/demskie/hyperionfive/gamestate gamestate.proto
*/
