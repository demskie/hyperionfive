<!DOCTYPE HTML>
<html>
	<head>
		<title>hyperion5 game</title>
		<meta charset="utf-8">
		
		<!-- below attempts to disable browser zoom -->
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

		<!-- below changes chrome mobile tab color -->
		<meta name="theme-color" content="#2e2e2e">

		<!-- below disables webapp mode as it is not compatibile with default Google OAuth signin -->
		<meta name="apple-mobile-web-app-capable" content="no">

		<!-- embedded stylesheet -->
		<link href='https://fonts.googleapis.com/css?family=Roboto+Condensed' rel='stylesheet' type='text/css'>
		<style>
			body {
				font-family: 'Roboto Condensed', sans-serif;
				margin: 0;
				background-color: #FFFFFF;
				overflow: hidden;
			}
			canvas { 
				width: 100%; 
				height: 100%;
			}
			@media all and (min-width: 960px) {
				h1 {
					font-size: 125px;
				}
				h2 {
					font-size: 50px;
				}
			}
			@media all and (max-width: 959px) and (min-width: 600px) {
				h1 {
					font-size: 14vw;
				}
				h2 {
					font-size: 6vw;
				}
			}
			@media all and (max-width: 599px) and (min-width: 50px) {
				h1 {
					font-size: 14vw;
				}
				h2 {
					font-size: 6vw;
				}
			}
		</style>
		<div id="loginPage" style="position:absolute; top:50%; left:50%; transform: translate(-50%, -75%);">
			<div id="gameTitle" style="color:grey;">hyperion5</div>
			<div id="loadingStatus" style="text-align:center; color:grey;">downloading...</div>
			<div id= "googleLoginButton" 
				style="position:absolute; left:50%; transform:translate(-50%, 0px);"
				class="g-signin2" 
				data-onsuccess="onSuccess" 
				data-onfailure="onFailure">
			</div>
		</div>
	</head>
	<body>

		<!-- resize elements on screen -->
		<script>
			function resizeLoginPage() {
				if (document.getElementById("loginPage").style.visibility !== "hidden") {
					var width = document.documentElement.clientWidth / 100
					if (width > 15) {
						width = 15
					}
					document.getElementById("gameTitle").style.fontSize = width*10+"px"
					document.getElementById("loadingStatus").style.fontSize = (width/3)*10+"px"
					var loginButtonScale = (document.documentElement.clientWidth/120)/6;
					if (loginButtonScale > 2.0833333333333335) {
						loginButtonScale = 2.0833333333333335
					}
					document.getElementById("googleLoginButton").style.transform = "translate(-50%, 0px) scale("+loginButtonScale+")";
				}
			}
			resizeLoginPage()
			window.addEventListener('resize', resizeLoginPage, false);
		</script>

		<!-- check browser compatibility-->
		<script>
			if (typeof(Worker) == "undefined"){
				alert("Sorry, your browser does not support WebWorkers. Halting.");
				throw("webworkers unsupported by this browser");
			}
			if (!window.WebSocket){
				alert("Sorry, your browser does not support WebSockets. Halting.");
				throw("websockets unsupported by this browser");
			}
		</script>

		<!-- load webix UI dependencies -->
		<script>
			function loadStyleSheet(src) {
				if (document.createStyleSheet) document.createStyleSheet(src);
				else {
					var stylesheet = document.createElement('link');
					stylesheet.href = src;
					stylesheet.rel = 'stylesheet';
					stylesheet.type = 'text/css';
					document.getElementsByTagName('head')[0].appendChild(stylesheet);
				}
			}
			function loadAllSheets() {
				loadStyleSheet("webix.css")
				loadStyleSheet("https://fonts.googleapis.com/css?family=Roboto")
			}
		</script>
		<script defer src="https://cdn.webix.com/edge/webix.js" onload="loadAllSheets()"></script>  
		<script defer src="skin.js"></script>

		<!-- webGL framework -->
		<script defer src="three.min.js"></script>

		<!-- check browser compatibility -->
		<script defer src="three.detecter.js"></script>

		<!-- mouse and touch events -->
		<script defer src="three.orbitcontrols.js"></script>

		<!-- browserifed protobuf schema output -->
		<script defer src="protobuf.js"></script>

		<!-- main game logic -->
		<script defer src="hyperionfive.js"></script>
		
		<!-- initialize google analytics -->
		<script>
			function initGoogleAnalytics() {
				if (typeof ga == "undefined") {
					(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
					(i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
					m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
					})(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
				}
			}
		</script>

		<!-- google oauth -->
		<meta name="google-signin-client_id" content="771328535291-3lv19jrlmhdd8f6hdhfd92qu3l7iugmd.apps.googleusercontent.com" onload="initGoogleAnalytics()">
		<script defer src="https://apis.google.com/js/platform.js"></script>
		
		<!-- hide elements once everything is loaded -->
		<script>
			if (document.readyState == 'loading') {
				document.addEventListener('DOMContentLoaded', function(){
					document.getElementById("loadingStatus").style.visibility = "hidden";
				}, false);
			} else {
				document.getElementById("loadingStatus").style.visibility = "hidden";
			}
		</script>

		<!-- google oauth and start game if  -->
		<script>
			function onSuccess(googleUser) {
				function work() {
					// parse oauth results
					var id_token = googleUser.getAuthResponse().id_token;
					var profile = googleUser.getBasicProfile();
					var USER_ID = profile.getId();
					// load game+gui once webix is loaded
					webix.ready(function(){
						startGame("google", id_token, USER_ID);
					});
					// tie google analytics to user
					initGoogleAnalytics();
					ga('set', 'userId', USER_ID);
					ga('create', 'UA-96532084-1', 'auto');
					ga('send', 'pageview');
				}
				if (document.readyState == 'loading') {
					document.addEventListener('DOMContentLoaded', work);
				} else {
					work();
				}
			}
			function onFailure(e) {
				console.log("unable to authenticate because "+e.error)
			}
		</script>
	</body>
</html>
