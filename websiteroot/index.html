<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="utf-8">

		<!-- below attempts to disable browser zoom -->
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

		<!-- below changes chrome mobile tab color -->
		<meta name="theme-color" content="#2e2e2e">

		<!-- below disables webapp mode as it is not compatibile with default Google OAuth signin -->
		<meta name="apple-mobile-web-app-capable" content="no">

		<title>hyperion5 game</title>
		<link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Roboto+Condensed' rel='stylesheet' type='text/css'>
		<style>
			body {
				font-family: 'Roboto Condensed', sans-serif;
				margin: 0;
				background-color: #FFFFFF;
				overflow: hidden;
			}
			canvas { width: 100%; height: 100% }
		</style>
	</head>
	<body>

		<div id="loginPage" style="position:absolute; top:50%; left:50%; transform: translate(-50%, -75%);">
			<div id="gameTitle" style="">
				<div style="font-size:56px; font-size:14vw; color:grey;"> hyperion5 </div>
			</div>
			<div id="loadingStatus" style="text-align:center">
				<div style="font-size:15px; font-size:6vw; color:grey;"> downloading... </div>
			</div>
			<div id= "googleLoginButton" style="position:absolute; left:50%; transform: translate(-50%, 0px); "
			class="g-signin2" data-onsuccess="onSuccess" data-onfailure="onFailure">
			</div>
		</div>

		<!-- webGL framework -->
		<script src="three.min.js"></script>

		<!-- browserifed customSchema and protobufRuntime -->
		<script src="protobuf.js" async defer></script>

		<!-- check browser compatibility -->
		<script src="three.detecter.js" async defer></script>

		<!-- mouse and touch events -->
		<script src="three.orbitcontrols.js" async defer></script>

		<!-- start google oauth boilerplate -->
		<script>
			function onSuccess(googleUser) {
				var id_token = googleUser.getAuthResponse().id_token;
				var profile = googleUser.getBasicProfile();
				var USER_ID = profile.getId();
				document.getElementById("loginPage").style.visibility = "hidden"

				//<!-- start google analytics -->
				ga('set', 'userId', USER_ID);
				ga('create', 'UA-96532084-1', 'auto');
				ga('send', 'pageview');
				//<!-- end google analytics -->

				startGame("google", id_token, USER_ID);
			}
			function onFailure(error) {
				console.log(error);
			}
		</script>
		<meta name="google-signin-client_id" content="771328535291-3lv19jrlmhdd8f6hdhfd92qu3l7iugmd.apps.googleusercontent.com">
		<script src="https://apis.google.com/js/platform.js"></script>
		<!-- end google oauth boilerplate -->

		<!-- start google analytics -->
		<script>
		(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
		(i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
		m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
		})(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
		</script>
		<!-- end google analytics -->

		<!-- start game logic -->
		<script src="hyperionfive.js"></script>
		<!-- end game logic -->

	</body>
</html>
