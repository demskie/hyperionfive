<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>hyperion5</title>
	<!-- webGL framework -->
	<script src="three.min.js"></script>
	<!-- check browser compatibility -->
	<script src="three.detecter.js"></script>
	<!-- mouse and touch events -->
	<script src="three.orbitcontrols.js"></script>
	<!-- browserifed protobuf schema output -->
	<script src="protobuf.js"></script>
	<!-- main game logic -->
	<script src="hyperionfive.js"></script>
	<!-- preferred font -->
	<link href='https://fonts.googleapis.com/css?family=Roboto+Condensed' rel='stylesheet' type='text/css'>
	<!-- replaced at transpile time with React -->
	<link rel="manifest" href="%PUBLIC_URL%/manifest.json">
	<link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">
	<!-- below attempts to disable browser zoom -->
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, minimum-scale=1, maximum-scale=1, shrink-to-fit=yes">
	<!-- below changes chrome mobile tab color -->
	<meta name="theme-color" content="#2e2e2e">
	<!-- below disables webapp mode as it is not compatibile with default Google OAuth signin -->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

<style>
	html,
	body {
		margin: 0;
		overflow-x: hidden;
		overflow-y: hidden;
	}

	body {
		position: relative;
	}

	#root {
		position: absolute;
		left: 0;
		top: 0;
	}

	#threejs {
		position: absolute;
		left: 0;
		top: 0;
		z-index: -999;
		width: 100%;
		height: 100%;
	}
</style>

<script>
	(function (i, s, o, g, r, a, m) {
		i['GoogleAnalyticsObject'] = r; i[r] = i[r] || function () {
			(i[r].q = i[r].q || []).push(arguments)
		}, i[r].l = 1 * new Date(); a = s.createElement(o),
			m = s.getElementsByTagName(o)[0]; a.async = 1; a.src = g; m.parentNode.insertBefore(a, m)
	})(window, document, 'script', 'https://www.google-analytics.com/analytics.js', 'ga');
</script>

<body>
	<div id="root"></div>
	<canvas id="threejs"></canvas>
	<noscript>You need to enable JavaScript to run this app.</noscript>
</body>

</html>
