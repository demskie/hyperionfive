<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<!-- below attempts to disable browser zoom -->
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, shrink-to-fit=yes">
	<!-- below changes chrome mobile tab color -->
	<meta name="theme-color" content="#2e2e2e">
	<!-- below disables webapp mode as it is not compatibile with default Google OAuth signin -->
	<meta name="apple-mobile-web-app-capable" content="no">
	<!-- webGL framework -->
	<script src="three.min.js"></script>
	<!-- check browser compatibility -->
	<script src="three.detecter.js"></script>
	<!-- mouse and touch events -->
	<script src="three.orbitcontrols.js"></script>
	<!-- browserifed protobuf schema output -->
	<script src="protobuf.js"></script>
	<!-- main game logic -->
	<script src="hyperionfive.js"></script>
	<!-- preferred font -->
	<link href='https://fonts.googleapis.com/css?family=Roboto+Condensed' rel='stylesheet' type='text/css'>
	<!--
	  manifest.json provides metadata used when your web app is added to the
	  homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
	-->
	<link rel="manifest" href="%PUBLIC_URL%/manifest.json">
	<link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">
	<!--
	  Notice the use of %PUBLIC_URL% in the tags above.
	  It will be replaced with the URL of the `public` folder during the build.
	  Only files inside the `public` folder can be referenced from the HTML.

	  Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
	  work correctly both with client-side routing and a non-root public URL.
	  Learn how to configure a non-root public URL by running `npm run build`.
	-->
	<title>hyperion5</title>
</head>
<style>
	html,
	body {
		margin: 0;
	}

	#root {
		position: absolute;
		left: 0;
		top: 0;
	}

	#threejs {
		position: absolute;
		left: 0;
		top: 0;
		z-index: -999;
	}
</style>

<body>
	<div id="root"></div>
	<div id="threejs"></div>
	<noscript>You need to enable JavaScript to run this app.</noscript>
</body>
<script>
	document.documentElement.clientWidth /= window.devicePixelRatio
	alert(
		"pixelRatio: " + window.devicePixelRatio + "\n"
		+ "windowInnerHeight: " + window.innerHeight + "\n"
		+ "documentClientHeight: " + document.documentElement.clientHeight + "\n"
		+ "bodyClientHeight: " + document.body.clientHeight
	)
</script>

</html>
