<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <!-- below attempts to disable browser zoom -->
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, shrink-to-fit=no">

		<!-- below changes chrome mobile tab color -->
		<meta name="theme-color" content="#2e2e2e">

		<!-- below disables webapp mode as it is not compatibile with default Google OAuth signin -->
    <meta name="apple-mobile-web-app-capable" content="no">

    <!-- webGL framework -->
		<script src="three.min.js"></script>

		<!-- check browser compatibility -->
		<script src="three.detecter.js"></script>

		<!-- mouse and touch events -->
		<script src="three.orbitcontrols.js"></script>

		<!-- browserifed protobuf schema output -->
		<script src="protobuf.js"></script>

		<!-- main game logic -->
    <script src="hyperionfive.js"></script>
    
    <!-- embedded stylesheet -->
		<link href='https://fonts.googleapis.com/css?family=Roboto+Condensed' rel='stylesheet' type='text/css'>
    <style>
      body {
        font-family: 'Roboto Condensed', sans-serif;
        margin: 0;
        background-color: #FFFFFF;
        overflow: hidden;
      }
      canvas { 
        width: 100%; 
        height: 100%;
      }
    </style>
    <div id="loginPage" style="position:absolute; top:50%; left:50%; transform: translate(-50%, -75%);">
      <div id="gameTitle" style="color:grey;">hyperion5</div>
      <div id="loadingStatus" style="text-align:center; color:grey;">downloading...</div>
      <div id="googleLoginButton" 
        style="position:absolute; left:50%; transform:translate(-50%, 0px);"
        class="g-signin2" 
        data-onsuccess="onSuccess" 
        data-onfailure="onFailure">
      </div>
    </div>

    <!-- initialize google analytics -->
		<script>
      function initGoogleAnalytics() {
        if (typeof ga == "undefined") {
          (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
          (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
          m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
          })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
        }
      }
    </script>

    <!-- google oauth -->
		<meta name="google-signin-client_id" content="771328535291-3lv19jrlmhdd8f6hdhfd92qu3l7iugmd.apps.googleusercontent.com" onload="initGoogleAnalytics()">
		<script src="https://apis.google.com/js/platform.js"></script>
    
    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    
    <!-- resize elements on screen -->
		<script>
      function resizeLoginPage() {
        if (document.getElementById("loginPage").style.visibility !== "hidden") {
          var width = document.documentElement.clientWidth / 100
          if (width > 15) {
            width = 15
          }
          document.getElementById("gameTitle").style.fontSize = width*10+"px"
          document.getElementById("loadingStatus").style.fontSize = (width/3)*10+"px"
          var loginButtonScale = (document.documentElement.clientWidth/120)/6;
          if (loginButtonScale > 2.0833333333333335) {
            loginButtonScale = 2.0833333333333335
          }
          document.getElementById("googleLoginButton").style.transform = "translate(-50%, 0px) scale("+loginButtonScale+")";
        }
      }
      resizeLoginPage()
      window.addEventListener('resize', resizeLoginPage, false);
    </script>

    <!-- hide elements once everything is loaded -->
		<script>
        if (document.readyState == 'loading') {
          document.addEventListener('DOMContentLoaded', function(){
            document.getElementById("loadingStatus").style.visibility = "hidden";
          }, false);
        } else {
          document.getElementById("loadingStatus").style.visibility = "hidden";
        }
      </script>


    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
