syntax = "proto3";
package backendmessage;

// backend server >>> client

message NullMessage {}

message StaticGalaxy {
	int32 id = 1;
	int64 globalX = 2;
	int64 globalY = 3;
	int32 precision = 4;
	map<int32, StaticSystem> staticSystem = 128;
}

message StaticSystem {
	int32 interX = 1;
	int32 interY = 2;
}

message DynamicGalaxySection {
	int32 id = 1;
	int32 section = 2;
	map<int32, DynamicSystem> dynamicSystem = 128;
}

message DynamicSystem {
	int32 progress = 1;
	int32 dockedTitanCount = 2;
	int32 dockedCapitalCount = 3;
	int32 dockedFighterCount = 4;
}